# Dependency build scripts pnpm may run. The WebdriverIO driver packages would download browser drivers on
# install; the e2e suite uses its own msedgedriver matching WebView2 (tests/e2e/wdio.conf.ts), so they stay off.
allowBuilds:
  edgedriver: false
  esbuild: true
  geckodriver: false
  # The Supabase CLI downloads its binary on install (pnpm exec supabase …: local stack, pgTAP).
  supabase: true
