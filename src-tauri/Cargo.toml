[package]
name = "gayanshop-pos"
version = "0.1.0"
description = "GayanShop offline-first POS"
authors = ["GayanShop"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gayanshop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
log = "0.4"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread", "time"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "derive"] }

chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v5", "v7", "serde"] }

argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }  # OsRng for PIN salts
sha2 = "0.10"
hex = "0.4"
bitflags = "2"
unicode-normalization = "0.1"

# Typed IPC bindings. tauri-specta ships release candidates that require exact
# version pins matching its specta / specta-typescript.
specta = { version = "=2.0.0-rc.26", features = ["derive", "function"] }
specta-typescript = "0.0.13"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
tauri-plugin-dialog = "2"

[target.'cfg(windows)'.dependencies]
# Receipt printers: the spooler's RAW datatype and COM-port setup (doc §7.2).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Printing", "Win32_Devices_Communication", "Win32_Storage_FileSystem"] }

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3"

# argon2/sha2 are painfully slow unoptimised; keep debug builds and tests fast.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
